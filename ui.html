<!doctype html>
<meta charset="utf-8">
<title>Qwen3-VL Math → Code</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; }
  #drop { border: 2px dashed #aaa; border-radius: 8px; padding: 2rem; text-align: center; color: #666; cursor: pointer; }
  #drop.over { border-color: #4a90d9; background: #f0f7ff; }
  img { max-width: 100%; max-height: 320px; margin: 1rem 0; border-radius: 6px; }
  button { padding: .5rem 1rem; font-size: 1rem; cursor: pointer; }
  pre { background: #1e1e1e; color: #d4d4d4; padding: 1rem; border-radius: 6px; overflow-x: auto; position: relative; }
  .copy { position: absolute; top: .5rem; right: .5rem; font-size: .8rem; padding: .2rem .6rem; }
  #status { color: #888; margin: 1rem 0; white-space: pre-wrap; }
  label { font-size: .9rem; color: #555; }
  input[type=text] { width: 100%; padding: .4rem; box-sizing: border-box; }
</style>

<h2>Tải ảnh bài toán → code Python</h2>

<label>llama-server URL <input type="text" id="url" value="http://localhost:8000/v1/chat/completions"></label>
<p></p>
<div id="drop">Kéo thả ảnh vào đây, hoặc bấm để chọn file</div>
<input type="file" id="file" accept="image/*" hidden>
<img id="preview" hidden>
<button id="go" hidden>Giải → Code</button>
<div id="status"></div>
<div id="out"></div>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const preview = document.getElementById('preview');
const go = document.getElementById('go');
const status = document.getElementById('status');
const out = document.getElementById('out');
let dataUrl = null;

drop.onclick = () => fileInput.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); load(e.dataTransfer.files[0]); };
fileInput.onchange = () => load(fileInput.files[0]);

function load(f) {
  if (!f || !f.type.startsWith('image/')) return;
  const r = new FileReader();
  r.onload = () => { dataUrl = r.result; preview.src = dataUrl; preview.hidden = false; go.hidden = false; };
  r.readAsDataURL(f);
}

go.onclick = async () => {
  if (!dataUrl) return;
  out.innerHTML = ''; status.textContent = 'Đang gọi model...'; go.disabled = true;
  const body = {
    model: 'qwen3vl-math', stream: false,
    messages: [{ role: 'user', content: [
      { type: 'text', text: 'Write the Python code that reproduces the following mathematical image.' },
      { type: 'image_url', image_url: { url: dataUrl } },
    ]}],
  };
  try {
    const res = await fetch(document.getElementById('url').value, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + await res.text());
    const j = await res.json();
    const text = j.choices?.[0]?.message?.content ?? JSON.stringify(j);
    render(text);
    status.textContent = '';
  } catch (e) {
    status.textContent = 'Lỗi: ' + e.message + '\n(llama-server đã chạy chưa? URL đúng chưa?)';
  } finally { go.disabled = false; }
};

function render(text) {
  // tách block ```python ... ```; nếu không có thì hiện nguyên văn
  const m = [...text.matchAll(/```(?:python)?\n([\s\S]*?)```/g)];
  const blocks = m.length ? m.map(x => x[1]) : [text];
  for (const code of blocks) {
    const pre = document.createElement('pre');
    const c = document.createElement('code');
    c.textContent = code.trim();
    const btn = document.createElement('button');
    btn.className = 'copy'; btn.textContent = 'Copy';
    btn.onclick = () => { navigator.clipboard.writeText(code.trim()); btn.textContent = 'Đã copy'; setTimeout(() => btn.textContent = 'Copy', 1500); };
    pre.append(btn, c);
    out.append(pre);
  }
}
</script>
